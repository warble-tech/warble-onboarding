# Warble workstation — AC power profile
# Goal: reduce thermal spiking while keeping sustained throughput high

# intel_pstate only exposes powersave + performance; EPP controls the actual bias
CPU_SCALING_GOVERNOR_ON_AC=powersave

# Disable turbo on AC — eliminates the 97°C spikes at cost of ~20% peak perf
# The chip runs cooler and sustains base clock better without thermal throttling
CPU_BOOST_ON_AC=0

# Energy/performance bias: balance_performance gives good throughput without heat
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance

# Cap at 85% of max freq (3.6 GHz instead of 4.2 GHz) — stays below thermal limit
CPU_MIN_PERF_ON_AC=20
CPU_MAX_PERF_ON_AC=85

# balanced profile keeps fan+power in check vs "performance"
PLATFORM_PROFILE_ON_AC=balanced

# Keep USB/PCIe active on AC — prevents stuttering from autosuspend
USB_AUTOSUSPEND=0
PCIE_ASPM_ON_AC=performance
