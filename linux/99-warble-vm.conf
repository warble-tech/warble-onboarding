# Warble workstation — VM/memory tuning
# Applied via: sudo cp 99-warble-vm.conf /etc/sysctl.d/ && sudo sysctl -p /etc/sysctl.d/99-warble-vm.conf

# Reduce swap pressure — default 60 means kernel starts swapping at 40% mem usage.
# With 16GB RAM, set to 10 so swap is a last resort only
vm.swappiness=10

# Kernel keeps more page cache before evicting — better for dev workloads with lots of file I/O
vm.vfs_cache_pressure=50

# Dirty page writeback — write to disk sooner to avoid large bursts (default 20/10)
vm.dirty_ratio=10
vm.dirty_background_ratio=5

# Writeback timeout: 5s instead of 30s — spreads I/O more evenly
vm.dirty_writeback_centisecs=500
vm.dirty_expire_centisecs=1000

# Already set, keeping in sync
vm.max_map_count=1048576
